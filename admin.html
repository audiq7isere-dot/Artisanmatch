<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — ArtisanMatch</title><link rel="stylesheet" href="/app.css"><style>.adminHero{padding:38px 0 20px}.adminHero h1{font-size:42px;margin:6px 0}.adminStats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.adminTabs{display:flex;gap:8px;overflow:auto;margin:22px 0}.adminTabs button{white-space:nowrap}.adminCard{display:grid;grid-template-columns:1.4fr .8fr;gap:22px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 8px 30px #0f172a0a}.adminCard h3{margin:7px 0}.contact{display:grid;gap:7px;background:#f8fafc;padding:15px;border-radius:14px}.contact a{color:var(--b);font-weight:700}@media(max-width:700px){.adminStats,.adminCard{grid-template-columns:1fr}.adminHero h1{font-size:34px}}</style></head><body><header><div class="wrap"><nav><a class="logo" href="/app.html">Artisan<span>Match</span></a><a class="btn ghost" href="/app.html">Voir le site</a></nav></div></header><main><div class="wrap adminHero"><span class="pill">🔐 Administration sécurisée</span><h1>Tableau de bord</h1><p class="meta">Pilotez les demandes, les particuliers et les artisans inscrits.</p><div id="stats" class="adminStats"></div><div class="adminTabs"><button class="tab active" data-id="projects" onclick="showAdminTab('projects')">Demandes de travaux</button><button class="tab" data-id="artisans" onclick="showAdminTab('artisans')">Artisans & notes</button><button class="tab" data-id="clients" onclick="showAdminTab('clients')">Particuliers</button></div><section id="projects" class="adminPanel"></section><section id="artisans" class="adminPanel" hidden></section><section id="clients" class="adminPanel" hidden></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/admin.js"></script></body></html>
