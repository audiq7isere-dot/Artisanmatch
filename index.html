<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FootShow — Montre ton talent</title><meta name="description" content="FootShow, la plateforme où les joueurs de football présentent leur profil et leurs meilleures actions aux clubs et recruteurs."><meta name="theme-color" content="#07120d"><link rel="stylesheet" href="/footshow.css"></head><body>
<header class="topbar"><a class="brand" href="#">Foot<span>Show</span></a><div class="tagline">Montre ton talent ⚽</div></header><main class="page"><section id="auth" class="auth hidden"></section><section id="app" class="hidden"><div class="layout"><section class="leftcol"><div class="panel filters"><h2>Trouver un talent</h2><div class="filter-grid"><div><label>Code postal</label><input id="filterDepartment" inputmode="numeric" maxlength="5" placeholder="Ex. 73000" class="input"></div><div><label>Poste</label><select id="filterPosition" class="input position-select"></select></div><div><label>Catégorie</label><select id="filterCategory" class="input category-select"></select></div></div><div class="filter-actions"><button id="applyFilters" class="primary">Filtrer</button><button id="resetFilters" class="secondary">Réinitialiser</button></div></div><div class="panel global-rank-card"><div id="globalRanking"></div></div><div id="playersList" class="players"></div></section><aside id="profilePane" class="profile-pane"></aside></div></section></main>
<nav id="bottomNav" class="bottom-nav hidden"><button data-view="home" class="nav active">⌂<small>Accueil</small></button><button id="contestsNav" class="nav">🏆<small>Concours</small></button><button id="quizNav" class="nav">🧠<small>Quiz</small></button><button id="gameNav" class="nav">🎮<small>Jeu</small></button><button id="messagesNav" class="nav">💬<small>Messages</small><span id="messagesBadge" class="hidden"></span></button><button data-view="profile" class="nav">👤<small>Mon profil</small></button><button id="logoutBtn" class="nav">↪<small>Déconnexion</small></button></nav>
<section id="myProfile" class="drawer hidden"><div class="drawer-inner"><button id="closeMyProfile" class="close">×</button><h2>Mon profil</h2><div id="myProfileSummary"></div></div></section><section id="messagesDrawer" class="drawer hidden"><div class="drawer-inner"><button id="closeMessages" class="close">×</button><h2>💬 Messages</h2><div id="conversationsList"></div></div></section><section id="contestsDrawer" class="drawer hidden"><div class="drawer-inner"><button id="closeContests" class="close">×</button><div id="contestsContent"></div></div></section><section id="quizDrawer" class="drawer hidden"><div class="drawer-inner"><button id="closeQuiz" class="close">×</button><div id="quizContent"></div></div></section><section id="gameDrawer" class="drawer hidden"><div class="drawer-inner"><button id="closeGame" class="close">×</button><div id="gameContent"></div></div></section><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script defer src="/footshow.js"></script><script defer src="/videos-click.js"></script><script defer src="/messages-inbox.js"></script><script defer src="/contests.js"></script><script defer src="/quiz.js"></script><script defer src="/global-ranking.js"></script><script defer src="/mobile-actions.js"></script><script defer src="/search-name.js"></script><script type="module" src="/game.js"></script></body></html>
